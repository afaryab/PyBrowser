name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: pybrowser-linux
          - os: windows-latest
            platform: windows
            artifact: pybrowser-windows.exe
          - os: macos-latest
            platform: macos
            artifact: pybrowser-macos
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libegl1-mesa \
          libdbus-1-3
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Build with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --name pybrowser \
          --onefile \
          --windowed \
          --add-data "src/pybrowser:pybrowser" \
          src/pybrowser/main.py
    
    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --name pybrowser `
          --onefile `
          --windowed `
          --add-data "src/pybrowser;pybrowser" `
          src/pybrowser/main.py
    
    - name: Build with PyInstaller (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --name pybrowser \
          --onefile \
          --windowed \
          --add-data "src/pybrowser:pybrowser" \
          src/pybrowser/main.py
    
    - name: Create DMG (macOS)
      if: runner.os == 'macOS'
      run: |
        # Install create-dmg
        brew install create-dmg
        # Create DMG
        create-dmg \
          --volname "PyBrowser" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --app-drop-link 425 120 \
          "dist/PyBrowser.dmg" \
          "dist/pybrowser.app" || true
    
    - name: Create installer (Windows)
      if: runner.os == 'Windows'
      run: |
        # For now, just zip the executable
        Compress-Archive -Path dist/pybrowser.exe -DestinationPath dist/pybrowser-windows.zip
    
    - name: Create tarball (Linux)
      if: runner.os == 'Linux'
      run: |
        cd dist
        tar -czf pybrowser-linux.tar.gz pybrowser
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.artifact }}
        path: |
          dist/pybrowser*
          !dist/*.spec

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        draft: false
        prerelease: false
        files: |
          artifacts/**/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
